<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Taskly favicon — the app icon reduced to what survives 16px.

       The full icon (taskly-icon.svg) carries an orbit, a sheen and two ruled
       lines. At 16 pixels all three collapse into noise, so only the three
       shapes that still read are kept: the ink ground, the white page, and the
       green check. Green is reserved for "done" across the whole product, so
       it is the one colour worth spending a favicon's worth of pixels on.

       Colours are lifted from the app icon rather than re-picked, so a browser
       tab and the home screen show the same brand. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283F"/>
      <stop offset="0.45" stop-color="#23406E"/>
      <stop offset="1" stop-color="#3A5D96"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#ink)"/>

  <!-- The page fills most of the tile: at 16px it is the shape that says
       "document" before any detail inside it is resolvable. -->
  <rect x="7" y="5.5" width="18" height="21" rx="3" fill="#FFFFFF"/>

  <!-- Stroke width is deliberately heavy (3.2 of 32). A hairline check
       disappears entirely once the browser downsamples to 16px. -->
  <path d="M10.8 16.2 L14.2 19.6 L21.2 11.8"
        fill="none" stroke="#2F9E63" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
